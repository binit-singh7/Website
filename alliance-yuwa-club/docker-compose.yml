services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alliance_yuwa}
      POSTGRES_USER: ${POSTGRES_USER:-alliance_yuwa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-allianceyuwaclub.org.np,www.allianceyuwaclub.org.np,api.allianceyuwaclub.org.np,localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://allianceyuwaclub.org.np}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://allianceyuwaclub.org.np}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://allianceyuwaclub.org.np}
      DATABASE_URL: postgresql://${POSTGRES_USER:-alliance_yuwa}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-alliance_yuwa}
      USE_SUPABASE_STORAGE: ${USE_SUPABASE_STORAGE:?Set USE_SUPABASE_STORAGE=true for production media storage}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:?Set SUPABASE_STORAGE_BUCKET}
      SUPABASE_S3_ACCESS_KEY_ID: ${SUPABASE_S3_ACCESS_KEY_ID:?Set SUPABASE_S3_ACCESS_KEY_ID}
      SUPABASE_S3_SECRET_ACCESS_KEY: ${SUPABASE_S3_SECRET_ACCESS_KEY:?Set SUPABASE_S3_SECRET_ACCESS_KEY}
      SUPABASE_S3_ENDPOINT_URL: ${SUPABASE_S3_ENDPOINT_URL:?Set SUPABASE_S3_ENDPOINT_URL}
      POSTGRES_DB: ${POSTGRES_DB:-alliance_yuwa}
      POSTGRES_USER: ${POSTGRES_USER:-alliance_yuwa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.allianceyuwaclub.org.np/api}
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
  media_data:
